<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" width="450" height="800">
  <defs>
    <linearGradient id="bg-grad-02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1c" />
      <stop offset="50%" stop-color="#0b162c" />
      <stop offset="100%" stop-color="#050912" />
    </linearGradient>
    <radialGradient id="glow-grad-02" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#4E89DF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="border-grad-02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#4E89DF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Background Card Base -->
  <rect x="4" y="4" width="442" height="792" rx="26" fill="url(#bg-grad-02)" stroke="url(#border-grad-02)" stroke-width="2" />
  <rect x="16" y="16" width="418" height="768" rx="18" fill="none" stroke="#4E89DF" stroke-width="1" stroke-opacity="0.2" />

  <!-- Center Ambient Radial Glow -->
  <circle cx="225" cy="380" r="180" fill="url(#glow-grad-02)" />

  <!-- Top Header Tag -->
  <g transform="translate(225, 80)" text-anchor="middle">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#060B16" stroke="#4E89DF" stroke-width="1.2" stroke-opacity="0.6" />
    <text y="6" font-family="'Jura', 'JetBrains Mono', sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#93C5FD">FORTHCOMING PAPER</text>
  </g>

  <!-- Central Emblem Geometry (Kornblume & Forget-Me-Not Motifs) -->
  <g transform="translate(225, 370)">
    <!-- Decorative Outer Ring -->
    <circle r="120" fill="none" stroke="#4E89DF" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 6" />
    <circle r="105" fill="#080E1C" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.6" />
    <circle r="90" fill="none" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.4" />

    <!-- Motif Petals / Accents -->
    <circle cx="0" cy="-105" r="5" fill="#93C5FD" />
    <circle cx="0" cy="105" r="5" fill="#93C5FD" />
    <circle cx="-105" cy="0" r="5" fill="#93C5FD" />
    <circle cx="105" cy="0" r="5" fill="#93C5FD" />

    <!-- Center Big Number -->
    <text x="0" y="28" text-anchor="middle" font-family="'Google Sans Flex', 'Space Grotesk', sans-serif" font-size="96" font-weight="800" fill="#FFFFFF" letter-spacing="-2">02</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(225, 680)" text-anchor="middle">
    <text y="-30" font-family="'Google Sans Flex', sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">GaN/SiC Trapping Kinetics</text>
    <rect x="-120" y="0" width="240" height="34" rx="8" fill="#0B1528" stroke="#4E89DF" stroke-width="1" stroke-opacity="0.5" />
    <text y="22" font-family="'Jura', sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#60A5FA">Quan (Harry) Nguyen (Co-Author)</text>
  </g>
</svg>